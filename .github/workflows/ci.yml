name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-content:
    name: Forbidden-content scan
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Secrets, home folders and real-looking addresses
        # Searches every file and the rebuilt text of every recorded Claude
        # Code run (streamed text can split a path or an email across frames).
        run: python3 Scripts/public-gate.py .

  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    name: Build + full test suite (XCTest + Swift Testing) on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift build products
        uses: actions/cache@v4
        with:
          path: .build.noindex/ci
          key: swiftpm-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: swiftpm-${{ matrix.runner }}-
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Enumerate test inventory
        run: |
          Scripts/swiftpm-public.sh test list --scratch-path .build.noindex/ci > ci-inventory.txt
          wc -l ci-inventory.txt
          # Guard against silent test loss: compare against the frozen inventory.
          frozen=$(grep -c . Scripts/test-inventory.txt)
          current=$(grep -c . ci-inventory.txt)
          echo "frozen=$frozen current=$current"
          [ "$current" -ge "$frozen" ] || { echo "Test inventory shrank ($current < $frozen)"; exit 1; }
      - name: Run full suite (serial — the project's canonical gate)
        # The canonical automated gate is deliberately serial: a family of
        # wall-clock-bounded process/timing tests is honest about real deadlines
        # and flakes under parallel load (slower CI hardware makes it worse).
        # Do not switch to parallel without first widening those bounds in source.
        run: Scripts/swiftpm-public.sh test --no-parallel --scratch-path .build.noindex/ci
      - name: Pure source-update and bootstrap fixtures
        run: |
          /bin/sh Scripts/test-install-sh.sh
          /usr/bin/python3 -I -B -S -m unittest discover -s Tools/SourceUpdateTests -p 'test_*.py'
      - name: Compile the app without signing (not an installable artifact)
        run: |
          mkdir -p .build.noindex/ci-native/home .build.noindex/ci-native/tmp
          /usr/bin/env -i \
            DEVELOPER_DIR="$(xcode-select -p)" \
            HOME="$PWD/.build.noindex/ci-native/home" \
            CFFIXED_USER_HOME="$PWD/.build.noindex/ci-native/home" \
            TMPDIR="$PWD/.build.noindex/ci-native/tmp" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
            GIT_ASKPASS=/usr/bin/false SSH_ASKPASS=/usr/bin/false NETRC=/dev/null \
            /usr/bin/xcodebuild -project OpenBotsNext.xcodeproj -scheme OpenBotsPreviewApp \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$PWD/.build.noindex/ci-native/DerivedData" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_DEBUG_DYLIB=NO \
            build

# Live-provider probes are never ordinary CI: no job here logs in, calls Claude,
# or touches real user data. Anything live is opt-in, manual, and separately approved.

